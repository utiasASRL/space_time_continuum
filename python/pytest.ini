[pytest]
# A sourced ROS2 distribution puts its pytest plugins (launch_testing, launch_ros, launch_pytest)
# on PYTHONPATH, and pytest loads them at startup; they need packages the venv may not have
# (e.g. yaml). The tests don't use them, so they are always disabled.
addopts = -p no:launch_testing -p no:launch_ros -p no:launch_pytest
